[project]
name = "miralign"
version = "0.1.0"
description = "Position-aware miRNA-target alignment with learnable weights"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "biopython>=1.86",
    "ipykernel>=6.29.0",
    "joblib>=1.4.2",
    "jupyterlab>=4.2.0",
    "matplotlib>=3.9.2",
    "mirbench>=1.0.3",
    "numba>=0.60.0",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pytest>=8.0.0",
    "scikit-learn>=1.4.2",
    "scipy>=1.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
